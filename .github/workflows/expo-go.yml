name: Приложение — Expo Go

# Каждое изменение mobile/ в main публикуется как EAS Update (ветка preview): приложение открывается в Expo Go
# по QR-коду из сводки прогона. Нужен секрет EXPO_TOKEN (expo.dev → Settings → Access tokens), без него прогон
# только подсказывает, что сделать.
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/expo-go.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expo-go
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Есть ли токен Expo
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Expo Go: нужен секрет EXPO_TOKEN"
              echo "1. expo.dev → Settings → Access tokens → Create token."
              echo "2. GitHub → Settings → Secrets and variables → Actions → New repository secret: имя EXPO_TOKEN, значение — токен."
              echo "3. Actions → «Приложение — Expo Go» → Run workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.has == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.has == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.has == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Зависимости
        if: steps.token.outputs.has == 'true'
        working-directory: mobile
        run: npm ci

      - name: Проект EAS (только первый запуск)
        if: steps.token.outputs.has == 'true'
        working-directory: mobile
        run: |
          if node -e "process.exit(require('./app.json').expo.extra?.eas?.projectId ? 0 : 1)"; then
            echo "Проект EAS уже настроен"
            exit 0
          fi
          eas init --non-interactive --force
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const id = a.expo.extra.eas.projectId;
            a.expo.updates = { url: 'https://u.expo.dev/' + id };
            a.expo.runtimeVersion = { policy: 'sdkVersion' };
            fs.writeFileSync('app.json', JSON.stringify(a, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "Приложение: проект EAS для Expo Go (projectId, адрес обновлений)"
          git push

      - name: Публикация обновления
        id: preview
        if: steps.token.outputs.has == 'true'
        uses: expo/expo-github-action/preview@v8
        with:
          working-directory: mobile
          command: eas update --auto --branch preview --non-interactive
          comment: false
          qr-target: expo-go

      - name: QR-код для Expo Go
        if: steps.token.outputs.has == 'true'
        run: |
          {
            echo "### Открыть в Expo Go"
            echo "Установите Expo Go (App Store / Google Play), войдите тем же аккаунтом Expo и отсканируйте код камерой телефона."
            echo ""
            echo "![QR](${{ steps.preview.outputs.qr }})"
            echo ""
            echo "Ссылка на обновление: ${{ steps.preview.outputs.link }}"
            echo "Версия среды: ${{ steps.preview.outputs.runtimeVersion }}"
          } >> "$GITHUB_STEP_SUMMARY"
