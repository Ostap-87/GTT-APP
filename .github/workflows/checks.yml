name: Проверки

on:
  push:
    branches: [main]
    paths: ['server/**', 'miniprogram/**', 'tools/mp-check.mjs', '.github/workflows/checks.yml']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сервер — тесты
        run: npm test --prefix server
      - name: Мини-программа — статика и сценарии
        run: node tools/mp-check.mjs
