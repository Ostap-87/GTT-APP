<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>C · План поездки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sofia+Sans+Extra+Condensed:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1a73e8;text-decoration:none}a:hover{color:#1558b8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #0f1b2d; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 12px; border-bottom: 1px solid #eef1f6">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-family: 'Sofia Sans Extra Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 0.95; text-transform: uppercase">План поездки</h1>
      <span style="font-size: 13px; color: #5b6576">6 дней одной лентой · сейчас 09:05</span>
    </div>
    <button style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #1a73e8; background: #ffffff; color: #1558b8; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600">Сейчас</button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: #ffffff">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 20px; background: {{d.headBg}}; border-bottom: 1px solid #eef1f6">
          <span style="font-size: 13px; font-weight: 700; color: {{d.headFg}}">{{d.title}}</span>
          <span style="font-size: 12px; font-weight: 600; color: {{d.headFg}}">{{d.note}}</span>
        </div>
        <sc-for list="{{d.items}}" as="it" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column">
            <sc-if value="{{it.now}}" hint-placeholder-val="{{false}}">
              <div aria-label="Сейчас" style="display: flex; align-items: center; gap: 6px; padding: 2px 20px 0 62px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #f26b1d"></span><span style="flex: 1; height: 2px; background: #f26b1d"></span><span style="font-size: 11px; font-weight: 700; color: #a2470a">09:05</span></div>
            </sc-if>
            <sc-if value="{{it.row}}" hint-placeholder-val="{{true}}">
              <div style="display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 20px; border-bottom: 1px solid #f2f4f8">
                <span style="font-size: 13px; font-weight: 700; color: {{it.fg}}">{{it.t}}</span>
                <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 600; color: {{it.fg}}">{{it.name}}</span><span style="font-size: 12px; color: #5b6576">{{it.place}}</span></span>
                <sc-if value="{{it.hasChip}}" hint-placeholder-val="{{false}}"><span style="font-size: 11.5px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: {{it.chipBg}}; color: {{it.chipFg}}">{{it.chip}}</span></sc-if>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </section>
    </sc-for>
  </main>

  <nav aria-label="Разделы" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #ffffff; border-top: 1px solid #e3e7ef; padding: 8px 4px 24px">
    <a href="C-Feed.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5b6576">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
      Лента
    </a>
    <a href="C-Plan.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 700; color: #1a73e8">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      План
    </a>
    <a href="C-Library.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5b6576">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg>
      Материалы
    </a>
    <a href="C-People.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5b6576">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>
      Люди
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5b6576">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      Я
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function row(t, name, place, state, chip) {
      var done = state === 'done', next = state === 'next';
      return {
        row: true, now: false, t: t, name: name, place: place,
        fg: done ? '#8a93a3' : '#0f1b2d',
        hasChip: !!chip, chip: chip || '',
        chipBg: next ? '#ffb27a' : (done ? '#eef1f6' : '#e8f0fe'),
        chipFg: next ? '#0f1b2d' : (done ? '#5b6576' : '#1558b8')
      };
    }
    var nowMark = { row: false, now: true, t: '', name: '', place: '', fg: '', hasChip: false, chip: '', chipBg: '', chipFg: '' };
    var days = [
      { title: 'Пн, 9 ноября · Пекин', note: 'прошёл', headBg: '#f4f6fa', headFg: '#5b6576', items: [
        row('14:00', 'Прилёт и трансфер', 'Аэропорт → отель', 'done', ''),
        row('17:00', 'Брифинг экспедиции', 'Конференц-зал отеля', 'done', '1 заметка'),
        row('19:30', 'Приветственный ужин', 'Ресторан у отеля', 'done', '24 фото') ] },
      { title: 'Вт, 10 ноября · Пекин', note: 'сегодня', headBg: '#e8f0fe', headFg: '#1558b8', items: [
        nowMark,
        row('09:30', 'Выезд из отеля', 'Лобби · автобус №2', 'next', 'через 25 мин'),
        row('10:30', 'JD.com', 'Шоурум и встреча с менеджментом', '', 'вопросы'),
        row('13:00', 'Обед', 'Рядом с офисом JD.com', '', ''),
        row('15:00', 'Meituan', 'Встреча с командой', '', 'вопросы'),
        row('19:00', 'Ужин группы', 'Ресторан, адрес в карточке', '', '') ] },
      { title: 'Ср, 11 ноября · Шанхай', note: 'завтра', headBg: '#f4f6fa', headFg: '#0f1b2d', items: [
        row('07:40', 'Перелёт Пекин → Шанхай', 'Сбор в лобби в 05:45', '', 'билет'),
        row('13:30', 'Hema (Freshippo)', 'Магазин и склад', '', 'вопросы') ] }
    ];
    return { days: days };
  }
}
</script>
</body>
</html>
