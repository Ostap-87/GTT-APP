<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Делегат · План</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sofia+Sans+Extra+Condensed:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1a73e8;text-decoration:none}a:hover{color:#1558b8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f6fa; color: #0f1b2d; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: flex-end; justify-content: space-between; padding: 22px 20px 10px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; font-weight: 500; color: #5b6576">Пекин → Шанхай → Ханчжоу → Шэньчжэнь</span>
      <h1 style="margin: 0; font-family: 'Sofia Sans Extra Condensed', sans-serif; font-weight: 800; font-size: 40px; line-height: 0.95; text-transform: uppercase">План</h1>
    </div>
    <div role="group" aria-label="Вид" style="display: flex; padding: 3px; border-radius: 10px; background: #e3e7ef">
      <button aria-pressed="{{isList}}" onClick="{{toList}}" style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: {{listBg}}; color: #0f1b2d; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">Список</button>
      <button aria-pressed="{{isHours}}" onClick="{{toHours}}" style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: {{hoursBg}}; color: #0f1b2d; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">По часам</button>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 2px 16px 14px">
    <div role="tablist" aria-label="Дни поездки" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="6">
        <button role="tab" aria-selected="{{d.selected}}" onClick="{{d.pick}}" style="height: 70px; border-radius: 14px; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; cursor: pointer">
          <span style="font-size: 11px; font-weight: 600; color: {{d.sub}}">{{d.wd}}</span>
          <span style="font-family: 'Sofia Sans Extra Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1">{{d.n}}</span>
          <span style="font-size: 10.5px; color: {{d.sub}}">{{d.short}}</span>
        </button>
      </sc-for>
    </div>

    <section aria-label="Расписание дня" style="flex: 1; min-height: 0; background: #ffffff; border: 1px solid #e3e7ef; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 15px; font-weight: 700">{{title}}</h2><sc-if value="{{isToday}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; font-weight: 700; color: #0f1b2d; background: #ffb27a; padding: 3px 9px; border-radius: 999px">сегодня</span></sc-if></div>

      <sc-if value="{{isList}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
            <div style="display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid #eef1f6">
              <span style="font-size: 14px; font-weight: 700; color: {{it.timeFg}}">{{it.t}}</span>
              <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 600">{{it.name}}</span><span style="font-size: 12px; color: #5b6576">{{it.place}}</span></span>
              <sc-if value="{{it.hasChip}}" hint-placeholder-val="{{false}}"><span style="font-size: 11.5px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: {{it.chipBg}}; color: {{it.chipFg}}">{{it.chip}}</span></sc-if>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{isHours}}" hint-placeholder-val="{{true}}">
        <div style="position: relative; height: 420px">
          <sc-for list="{{hours}}" as="h" hint-placeholder-count="8">
            <div style="position: absolute; left: 0; right: 0; top: {{h.top}}px; display: flex; align-items: center; gap: 8px">
              <span style="width: 40px; font-size: 11px; color: #5b6576">{{h.label}}</span>
              <span style="flex: 1; height: 1px; background: #eef1f6"></span>
            </div>
          </sc-for>
          <sc-for list="{{blocks}}" as="b" hint-placeholder-count="5">
            <div style="position: absolute; left: 48px; right: 0; top: {{b.top}}px; height: {{b.h}}px; box-sizing: border-box; border-radius: 10px; padding: 4px 10px; background: {{b.bg}}; color: {{b.fg}}; display: flex; flex-direction: column; justify-content: center; overflow: hidden">
              <span style="font-size: 13px; font-weight: 700">{{b.label}}</span>
              <sc-if value="{{b.tall}}" hint-placeholder-val="{{false}}"><span style="font-size: 11.5px; color: {{b.sub}}">{{b.place}}</span></sc-if>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </section>
  </main>

  <nav aria-label="Разделы" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #ffffff; border-top: 1px solid #e3e7ef; padding: 8px 4px 24px">
    <a href="R-D-Today.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5b6576"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Сегодня</a>
    <a href="R-D-Plan.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 700; color: #1a73e8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>План</a>
    <a href="R-D-Library.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5b6576"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg>Материалы</a>
    <a href="R-D-People.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5b6576"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>Люди</a>
    <a href="R-D-Trip.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5b6576"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>Поездка</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 1, mode: 'hours' };
  }
  renderVals() {
    function ev(s, e, name, place, kind) { return { s: s, e: e, name: name, place: place, kind: kind || '' }; }
    var DAYS = [
      { wd: 'Пн', n: '9', short: 'Пекин', title: 'Пн, 9 ноября · Пекин', ev: [
        ev(14, 15.5, 'Прилёт и трансфер', 'Аэропорт → отель', 'move'),
        ev(17, 18, 'Брифинг экспедиции', 'Конференц-зал отеля'),
        ev(19.5, 21, 'Приветственный ужин', 'Ресторан у отеля') ] },
      { wd: 'Вт', n: '10', short: 'Пекин', title: 'Вт, 10 ноября · Пекин', ev: [
        ev(9.5, 10.25, 'Выезд из отеля', 'Лобби · автобус №2', 'move'),
        ev(10.5, 12.5, 'JD.com', 'Шоурум и встреча с менеджментом', 'co'),
        ev(13, 14, 'Обед', 'Рядом с офисом JD.com'),
        ev(15.5, 17.5, 'Meituan', 'Встреча с командой', 'moved'),
        ev(19, 20.5, 'Ужин группы', 'Ресторан, адрес по-китайски') ] },
      { wd: 'Ср', n: '11', short: 'Шанхай', title: 'Ср, 11 ноября · Шанхай', ev: [
        ev(7.67, 10, 'Перелёт в Шанхай', 'Сбор в лобби в 05:45', 'move'),
        ev(13.5, 15.5, 'Hema (Freshippo)', 'Магазин и склад', 'co'),
        ev(16.5, 18.5, 'Pinduoduo', 'Встреча с командой', 'co') ] },
      { wd: 'Чт', n: '12', short: 'Шанхай', title: 'Чт, 12 ноября · Шанхай', ev: [
        ev(10, 12, 'RT-Mart', 'Гипермаркет', 'co'),
        ev(14.5, 16.5, 'Ele.me', 'Мгновенная доставка', 'co'),
        ev(18, 21, 'Свободный вечер', 'Идеи — в материалах') ] },
      { wd: 'Пт', n: '13', short: 'Ханчжоу', title: 'Пт, 13 ноября · Ханчжоу', ev: [
        ev(8.5, 10, 'Переезд в Ханчжоу', 'Скоростной поезд', 'move'),
        ev(11, 14, 'Alibaba', 'Кампус и шоурум', 'co'),
        ev(18, 20, 'Переезд в Шэньчжэнь', 'Детали — у координатора', 'move') ] },
      { wd: 'Сб', n: '14', short: 'Шэньч.', title: 'Сб, 14 ноября · Шэньчжэнь', ev: [
        ev(10, 12, "Sam's Club", 'Магазин', 'co'),
        ev(14, 16, 'Yonghui', 'Супермаркет', 'co'),
        ev(18, 20, 'Итоги и вылет', 'Аэропорт Шэньчжэня', 'move') ] }
    ];
    function hm(x) { var h = Math.floor(x), m = Math.round((x - h) * 60); return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }
    var self = this, sel = this.state.sel, mode = this.state.mode;
    var days = DAYS.map(function (d, i) {
      var on = i === sel;
      return { wd: d.wd, n: d.n, short: d.short, selected: on ? 'true' : 'false',
        bg: on ? '#1a73e8' : '#ffffff', fg: on ? '#ffffff' : '#0f1b2d', sub: on ? '#dbe7fd' : '#5b6576', border: on ? '#1a73e8' : '#e3e7ef',
        pick: function () { self.setState({ sel: i }); } };
    });
    var evs = DAYS[sel].ev;
    var items = evs.map(function (x) {
      var moved = x.kind === 'moved', co = x.kind === 'co' || moved;
      return { t: hm(x.s), name: x.name, place: x.place, timeFg: moved ? '#a2470a' : '#0f1b2d',
        hasChip: co, chip: moved ? 'перенесено' : 'вопросы', chipBg: moved ? '#fff1e6' : '#e8f0fe', chipFg: moved ? '#a2470a' : '#1558b8' };
    });
    var PX = 30, START = 7;
    var hours = [];
    for (var h = 7; h <= 21; h += 2) hours.push({ label: (h < 10 ? '0' : '') + h + ':00', top: (h - START) * PX - 6 });
    var blocks = evs.map(function (x) {
      var moved = x.kind === 'moved', co = x.kind === 'co' || moved, mv = x.kind === 'move';
      var hgt = Math.max(24, Math.round((x.e - x.s) * PX) - 3);
      return { label: hm(x.s) + ' · ' + x.name, place: x.place, top: Math.round((x.s - START) * PX), h: hgt, tall: hgt >= 44,
        bg: moved ? '#fff1e6' : (co ? '#1a73e8' : (mv ? '#eef1f6' : '#f4f6fa')),
        fg: co && !moved ? '#ffffff' : '#0f1b2d', sub: co && !moved ? '#e3edff' : '#5b6576' };
    });
    var isList = mode === 'list';
    return {
      days: days, title: DAYS[sel].title, isToday: sel === 1, items: items, hours: hours, blocks: blocks,
      isList: isList, isHours: !isList, listBg: isList ? '#ffffff' : 'transparent', hoursBg: isList ? 'transparent' : '#ffffff',
      toList: function () { self.setState({ mode: 'list' }); }, toHours: function () { self.setState({ mode: 'hours' }); }
    };
  }
}
</script>
</body>
</html>
