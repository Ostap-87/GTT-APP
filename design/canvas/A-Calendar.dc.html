<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>A · Календарь</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sofia+Sans+Extra+Condensed:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1a73e8;text-decoration:none}a:hover{color:#1558b8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f6fa; color: #0f1b2d; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; flex-direction: column; gap: 4px; padding: 24px 20px 12px">
    <span style="font-size: 13px; font-weight: 500; color: #5b6576">Новый ритейл Китая · 9–14 ноября</span>
    <h1 style="margin: 0; font-family: 'Sofia Sans Extra Condensed', sans-serif; font-weight: 800; font-size: 40px; line-height: 0.95; text-transform: uppercase">Календарь</h1>
    <span style="font-size: 13px; color: #5b6576">Пекин → Шанхай → Ханчжоу → Шэньчжэнь</span>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 16px">
    <div role="tablist" aria-label="Дни поездки" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="6">
        <button role="tab" aria-selected="{{d.selected}}" onClick="{{d.pick}}" style="height: 76px; border-radius: 14px; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; cursor: pointer">
          <span style="font-size: 11px; font-weight: 600; color: {{d.sub}}">{{d.wd}}</span>
          <span style="font-family: 'Sofia Sans Extra Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1">{{d.n}}</span>
          <span style="font-size: 10.5px; color: {{d.sub}}">{{d.short}}</span>
        </button>
      </sc-for>
    </div>

    <section aria-label="Расписание дня" style="background: #ffffff; border: 1px solid #e3e7ef; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">{{title}}</h2>
        <sc-if value="{{isToday}}" hint-placeholder-val="{{true}}">
          <span style="font-size: 12px; font-weight: 700; color: #0f1b2d; background: #ffb27a; padding: 3px 9px; border-radius: 999px">сегодня</span>
        </sc-if>
      </div>
      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <div style="display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid #eef1f6">
          <span style="font-size: 14px; font-weight: 700">{{it.t}}</span>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 14px; font-weight: 600">{{it.name}}</span>
            <span style="font-size: 12px; color: #5b6576">{{it.place}}</span>
          </div>
          <sc-if value="{{it.co}}" hint-placeholder-val="{{false}}">
            <a href="#" style="font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #e8f0fe; color: #1558b8">Компания</a>
          </sc-if>
        </div>
      </sc-for>
    </section>

    <section style="background: #ffffff; border: 1px solid #e3e7ef; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 500">
        Напоминать за 30 минут
        <input type="checkbox" checked style="width: 44px; height: 24px; accent-color: #1a73e8">
      </label>
      <button style="height: 44px; border-radius: 12px; border: 1px solid #1a73e8; background: #ffffff; color: #1558b8; font-family: Inter, sans-serif; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>
        Добавить поездку в календарь телефона
      </button>
    </section>
  </main>

  <nav aria-label="Разделы" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #ffffff; border-top: 1px solid #e3e7ef; padding: 8px 4px 24px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5b6576">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Сегодня
    </a>
    <a href="A-Calendar.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 700; color: #1a73e8">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Календарь
    </a>
    <a href="A-Library.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5b6576">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg>
      Материалы
    </a>
    <a href="A-Delegates.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5b6576">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>
      Делегаты
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5b6576">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      Профиль
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 1 };
  }
  renderVals() {
    var DAYS = [
      { wd: 'Пн', n: '9', short: 'Пекин', title: 'Пн, 9 ноября · Пекин', items: [
        { t: '14:00', name: 'Прилёт и трансфер', place: 'Аэропорт → отель', co: false },
        { t: '17:00', name: 'Брифинг экспедиции', place: 'Конференц-зал отеля', co: false },
        { t: '19:30', name: 'Приветственный ужин', place: 'Ресторан у отеля', co: false } ] },
      { wd: 'Вт', n: '10', short: 'Пекин', title: 'Вт, 10 ноября · Пекин', items: [
        { t: '09:30', name: 'Выезд из отеля', place: 'Лобби · автобус №2', co: false },
        { t: '10:30', name: 'JD.com', place: 'Шоурум и встреча с менеджментом', co: true },
        { t: '13:00', name: 'Обед', place: 'Рядом с офисом JD.com', co: false },
        { t: '15:00', name: 'Meituan', place: 'Встреча с командой', co: true },
        { t: '19:00', name: 'Ужин группы', place: 'Ресторан, адрес в карточке', co: false } ] },
      { wd: 'Ср', n: '11', short: 'Шанхай', title: 'Ср, 11 ноября · Шанхай', items: [
        { t: '07:40', name: 'Перелёт Пекин → Шанхай', place: 'Сбор в лобби в 05:45', co: false },
        { t: '13:30', name: 'Hema (Freshippo)', place: 'Магазин и склад', co: true },
        { t: '16:30', name: 'Pinduoduo', place: 'Встреча с командой', co: true } ] },
      { wd: 'Чт', n: '12', short: 'Шанхай', title: 'Чт, 12 ноября · Шанхай', items: [
        { t: '10:00', name: 'RT-Mart', place: 'Гипермаркет', co: true },
        { t: '14:30', name: 'Ele.me', place: 'Мгновенная доставка', co: true },
        { t: '18:00', name: 'Свободный вечер', place: 'Рекомендации — в материалах', co: false } ] },
      { wd: 'Пт', n: '13', short: 'Ханчжоу', title: 'Пт, 13 ноября · Ханчжоу', items: [
        { t: '08:30', name: 'Переезд в Ханчжоу', place: 'Скоростной поезд', co: false },
        { t: '11:00', name: 'Alibaba', place: 'Кампус и шоурум', co: true },
        { t: '18:00', name: 'Переезд в Шэньчжэнь', place: 'Детали — у координатора', co: false } ] },
      { wd: 'Сб', n: '14', short: 'Шэньч.', title: 'Сб, 14 ноября · Шэньчжэнь', items: [
        { t: '10:00', name: "Sam's Club", place: 'Магазин', co: true },
        { t: '14:00', name: 'Yonghui', place: 'Супермаркет', co: true },
        { t: '18:00', name: 'Итоги и вылет', place: 'Аэропорт Шэньчжэня', co: false } ] }
    ];
    var sel = this.state.sel;
    var self = this;
    var days = DAYS.map(function (d, i) {
      var on = i === sel;
      return {
        wd: d.wd, n: d.n, short: d.short, selected: on ? 'true' : 'false',
        bg: on ? '#1a73e8' : '#ffffff', fg: on ? '#ffffff' : '#0f1b2d',
        sub: on ? '#dbe7fd' : '#5b6576', border: on ? '#1a73e8' : '#e3e7ef',
        pick: function () { self.setState({ sel: i }); }
      };
    });
    return { days: days, title: DAYS[sel].title, items: DAYS[sel].items, isToday: sel === 1 };
  }
}
</script>
</body>
</html>
