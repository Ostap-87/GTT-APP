  function dTrip() {

        <section class="card"><h3>Мои вопросы к компаниям</h3>${S.questions.length ? S.questions.map((q) => `<div class="li two"><div><div>${esc(q.ru)}</div><div class="s">${q.company} · ${q.status === 'sent' ? 'переведено и отправлено' : 'ждёт перевода координатором'}</div></div></div>`).join('') : '<span class="muted">Пока нет. Задайте их на вкладке «До».</span>'}</section>`;

      const r = S.myRating;
      const stars = [1, 2, 3, 4, 5].map((n) => `<button type="button" class="${n <= r ? 'on' : ''}" data-act="rate" data-arg="${n}" aria-label="${n} из 5">★</button>`).join('');
      const sent = S.reviews.length > 0;
      const mode = S.reviewMode;
      const review = sent
        ? `<div class="card info" style="padding:10px 12px">Спасибо! Отзыв${S.reviews[0].video ? ' (видео)' : ''} у координатора.</div>`
        : `<div class="seg light">${[['text', 'Текстом'], ['video', 'Видео']].map(([k, l]) => `<button type="button" data-act="reviewMode" data-arg="${k}" aria-pressed="${mode === k}">${l}</button>`).join('')}</div>
          ${mode === 'text'
    ? `<label class="field" for="reviewText">Ваш отзыв<textarea id="reviewText" rows="4" data-field="reviewText" placeholder="Что было самым полезным? Что улучшить?">${esc(S.form.reviewText || '')}</textarea></label>`
    : (S.videoAttached

          <div class="toggle-row"><label><input id="reviewConsent" type="checkbox" data-check="reviewConsent" ${S.reviewConsent ? 'checked' : ''}> Разрешаю Global Tech Tour опубликовать отзыв на сайте и в соцсетях</label></div>
          ${btn('sendReview', 'Отправить отзыв', 'primary full')}`;
      body = `<section class="card"><h3>Отзыв о поездке</h3>${review}</section>
        <section class="card"><h3>Оцените визит в JD.com</h3><div class="stars">${stars}</div><span class="muted">${r ? 'Спасибо! Компания увидит общую оценку группы, без имён.' : 'Компания видит только общую оценку группы.'}</span></section>
        <section class="card"><h3>Хочу продолжить</h3><span class="muted">Образцы, переговоры, повторная встреча — координатор передаст компании.</span>${btn('followup', 'Оставить запрос', 'primary full')}
          ${S.followups.map((f) => `<div class="li two"><div><div class="t">${f.company} · ${esc(f.typeRu)}</div><div class="s">${f.status === 'new' ? 'у координатора' : 'передано компании'}</div></div></div>`).join('')}</section>
        <section class="card"><h3>Фото, видео и отчёт</h3><span class="muted">Откроются 14 ноября, после возвращения группы.</span></section>`;
    }
    return `${delegateHead(`${me.ru} · делегат`, 'Моя поездка')}<div class="body">${seg}${body}</div>`;
  }

  function shift(t, minutes) {

  }

    return `${hostHead(L.delegation)}<div class="body"><div class="chips">${chips}</div>
      <section class="card info" style="flex-direction:row;gap:10px;align-items:flex-start">${icon('lock', 18)}<span>${L.privacy}</span></section>
      <section class="card"><div class="list">${rows}</div></section>

  }

  function qrSvg() {
    // Узор-заглушка в виде QR-кода (настоящий выдаёт WeChat по коду приглашения)
    let cells = '';
    let seed = 7;
    for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
      seed = (seed * 9301 + 49297) % 233280;
      const finder = (x < 7 && y < 7) || (x > 17 && y < 7) || (x < 7 && y > 17);
      if (finder) continue;
      if (seed / 233280 > 0.55) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }
    const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#0f1b2d"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#ffffff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#0f1b2d"/>`;
    return `<svg class="qr" viewBox="-2 -2 29 29" role="img" aria-label="QR-код приглашения"><rect x="-2" y="-2" width="29" height="29" fill="#ffffff"/><g fill="#0f1b2d">${cells}</g>${finder(0, 0)}${finder(18, 0)}${finder(0, 18)}</svg>`;
  }

    day: (i) => { S.day = Number(i); },
    stage: (k) => { S.tripStage = k; },
    viewAs: (v) => { S.viewAs = v || null; S.sheet = null; if (v) log('coordinator', `Включил «Смотреть как ${v === 'delegate' ? 'делегат' : 'JD.com'}» — экран ровно такой, как у них.`); },
    closeSheet: () => { S.sheet = null; },
    sheetSet: (arg) => { const [k, v] = arg.split('|'); S.sheet[k] = k === 'pick' && S.sheet.type === 'question' ? Number(v) : v; },
    lang: (l) => { S.lang = l; },
    hostFilter: (k) => { S.hostFilter = k; },

    // делегат
    busToggle: () => {
      if (S.missing.includes('d1')) { S.missing = S.missing.filter((x) => x !== 'd1'); log('delegate', `${me.ru}: «Я в автобусе» → у координатора ${busCount()}/18.`); toast(`Координатор видит: в автобусе ${busCount()} из 18`); }
      else { S.missing.unshift('d1'); log('delegate', `${me.ru} отменила отметку → ${busCount()}/18.`); }
    },
    taxi: () => { S.sheet = { type: 'taxi' }; },
    openEvent: (arg) => {
      const [day, t, name] = arg.split('|');
      const e = dayEvents(Number(day)).find((x) => x.t === t && x.name === name);
      if (e && e.kind === 'meal') S.sheet = { type: 'meal', ref: e.ref };
      else if (e && e.kind === 'culture') S.sheet = { type: 'culture', ref: e.ref };
      else S.sheet = { type: 'event', day: Number(day), t, name };
    },
    openHotel: (day) => { S.sheet = { type: 'hotel', day: Number(day) }; },
    openCulture: (ref) => { S.sheet = { type: 'culture', ref }; },
    contacts: () => { S.sheet = { type: 'contacts' }; },
    diet: () => { S.sheet = { type: 'diet', pick: S.diet }; },
    saveDiet: () => {
      if (!S.sheet.pick) return toast('Выберите вариант');
      S.diet = S.sheet.pick;
      S.sheet = null;
      log('delegate', `${me.ru} указала питание «${S.diet}» → у координатора в группе, рестораны предупреждены.`);
      toast('Сохранено: рестораны учтут');
    },
    reviewMode: (k) => { S.reviewMode = k; },
    recordVideo: () => { S.videoAttached = true; toast('В прототипе запись имитируется: видео 0:48'); },
    sendReview: () => {
      const text = (S.form.reviewText || '').trim();
      const video = S.reviewMode === 'video' && S.videoAttached;
      if (S.reviewMode === 'text' && !text) return toast('Напишите пару слов о поездке');
      if (S.reviewMode === 'video' && !S.videoAttached) return toast('Сначала запишите видео');
      S.reviews.unshift({ id: nid(), text: S.reviewMode === 'text' ? text : '', video, consent: S.reviewConsent, status: 'new' });
      log('delegate', `${me.ru} оставила отзыв ${video ? 'видео' : 'текстом'}${S.reviewConsent ? ' с разрешением на публикацию' : ''} → у координатора на пульте.`);
      toast('Отзыв отправлен координатору');
    },
    download: (k) => { S.downloaded[k] = !S.downloaded[k]; if (S.downloaded[k]) toast('Скачано — откроется без интернета'); },
    addNote: () => { S.form.noteText = ''; S.sheet = { type: 'note' }; },
    submitNote: () => { const t = (S.form.noteText || '').trim(); if (!t) return toast('Напишите текст заметки'); S.notes.unshift({ text: t, time: 'сейчас' }); S.sheet = null; toast('Заметка сохранена · видите только вы'); },
    intro: (id) => { S.intros[id] = true; log('delegate', `Запрос на знакомство: ${me.ru} → ${byId[id].ru}. Контакты откроются, если он согласится.`); toast(`${byId[id].ru} получит запрос на знакомство`); },
    fakeCall: (who) => toast(`В прототипе звонка нет — в приложении наберёт ${who}`),
    fakeMsg: (who) => toast(`В прототипе сообщения нет — в приложении откроется чат с ${who}`),
    tick: (k) => { S.checklist[k] = !S.checklist[k]; },
    askQ: (company) => { S.form.qText = ''; S.sheet = { type: 'question', company: ['JD.com', 'Meituan', 'Hema (Freshippo)'].includes(company) ? company : 'JD.com', pick: null }; },
    submitQ: () => {
      const sh = S.sheet;
      const own = (S.form.qText || '').trim();
      if (sh.pick == null && !own) return toast('Выберите вопрос или напишите свой');
      const base = sh.pick != null ? SUGGESTED_Q[sh.pick] : { ru: own, zh: `（原型：此处为协调人翻译的中文）${own}`, en: `(prototype: coordinator’s English translation) ${own}` };
      S.questions.push({ id: nid(), company: sh.company, ru: base.ru, zh: base.zh, en: base.en, status: 'pending' });
      S.addedQ += 1;
      S.sheet = null;
      log('delegate', `${me.ru} задала вопрос ${sh.company} → у координатора «ждут перевода».`);
      toast('Вопрос у координатора: он переведёт и отправит компании');
    },
    rate: (n) => { const first = !S.myRating; S.myRating = Number(n); if (first) log('delegate', `Оценка визита ${n}/5 → у JD.com общий отзыв ${rating().avg} (${rating().n} оценок), без имён.`); },
    followup: () => { S.sheet = { type: 'followup', company: 'JD.com', ftype: 'samples', consent: true }; },
    submitFollowup: () => {
      const sh = S.sheet;
      const t = FOLLOW_TYPES.find((x) => x.key === sh.ftype);
      S.followups.push({ id: nid(), company: sh.company, typeRu: t.ru, zh: t.zh, en: t.en, consent: sh.consent, status: 'new' });
      S.sheet = null;
      log('delegate', `${me.ru}: «Хочу продолжить» с ${sh.company} (${t.ru.toLowerCase()}) → у координатора на пульте.`);
      toast('Запрос у координатора');
    },

    // координатор
    thankReview: (id) => { const r = S.reviews.find((x) => x.id === id); r.status = 'done'; log('coordinator', `Поблагодарил ${ME_ACC} за отзыв.`); toast('Спасибо отправлено'); },
    shareReview: (id) => { const r = S.reviews.find((x) => x.id === id); r.status = 'done'; log('coordinator', `Отзыв ${ME_GEN} отправлен в очередь публикаций GTT (есть согласие).`); toast('Отзыв ушёл в очередь публикаций'); },
    markBus: (id) => { S.missing = S.missing.filter((x) => x !== id); log('coordinator', `Отметил ${byId[id].ru} в автобусе → ${busCount()}/18.`); },
    depart: () => {
      S.departed = true;
      log('coordinator', `«Автобус выехал» → JD.com видит «代表团已出发», делегаты — «в пути».`);
      if (S.hostSubscribed) { S.hostNotice = true; log('host', 'JD.com получила уведомление WeChat: «代表团已出发，预计10:25到达».'); toast('JD.com получила уведомление в WeChat'); }
      else toast('JD.com увидит статус на странице визита. Уведомление придёт, если включит напоминания');
    },
    acceptHema: () => {
      S.hema = 'accepted';
      S.dNotices.unshift({ text: 'Hema перенесли на 14:00 (ср, 11 ноября). План уже обновлён.', time: now(), tone: 'warn' });
      log('coordinator', 'Принял перенос Hema на 14:00 → у делегатов план обновлён и пришло уведомление.');
      toast('Группа получила уведомление, план обновлён');
    },
    discussHema: () => { S.hema = 'discuss'; log('coordinator', 'Hema: «Обсудить» → открыт чат с менеджером компании.'); toast('В приложении откроется чат с Hema'); },
    acceptJd: () => {
      const p = S.jd.proposal;
      S.jd = { status: 'confirmed', start: p.start, proposal: null };
      S.dNotices.unshift({ text: `JD.com перенесли на ${p.start}. План обновлён.`, time: now(), tone: 'warn' });
      log('coordinator', `Принял время JD.com ${p.start} → у компании «已确认», у делегатов новый план.`);
      toast('JD.com и группа получили новое время');
    },
    rejectJd: () => { S.jd.proposal = null; S.jd.status = 'confirmed'; log('coordinator', `Оставил JD.com прежнее время ${S.jd.start} → компания видит «已确认».`); },
    publishMat: (id) => {
      const m = S.materials.find((x) => x.id === id);
      m.status = 'published';
      S.dNotices.unshift({ text: `Новый материал от JD.com: «${m.name}» — в Материалах`, time: now(), tone: 'info' });
      log('coordinator', `Открыл делегатам «${m.name}» → у делегатов в Материалах, у JD.com статус «已发给代表团».`);
      toast('Материал открыт делегатам');
    },
    translateQ: () => {
      const n = pendingQ();
      S.questions.forEach((q) => { if (q.status === 'pending') q.status = 'sent'; });
      S.translatedQ += n;
      S.basePendingQ = 0;
      log('coordinator', `Перевёл и отправил ${n} ${plural(n, 'вопрос', 'вопроса', 'вопросов')} → компании видят их на китайском.`);
      toast('Вопросы отправлены компаниям на китайском');
    },
    forwardReply: (id) => {
      const r = S.replies.find((x) => x.id === id);
      r.forwarded = true;
      S.dNotices.unshift({ text: `JD.com ответила${r.toName ? ` (для ${r.toName})` : ''}: «${r.text}» — перевод координатора`, time: now(), tone: 'info' });
      log('coordinator', 'Переслал ответ JD.com делегатам → у делегата уведомление на «Сегодня».');
    },
    sendFollowup: (id) => {
      const f = S.followups.find((x) => x.id === id);
      f.status = 'sent';
      if (f.company === 'JD.com') {
        S.requests.push({ id: nid(), d: 'd1', zh: f.zh, en: f.en, consent: f.consent, isNew: true });
        log('coordinator', `Передал запрос ${ME_GEN} в JD.com → у компании во вкладке «访问后»${f.consent ? ' с контактами (есть согласие)' : ' без контактов'}.`);
      } else log('coordinator', `Передал запрос ${ME_GEN} в ${f.company}.`);
      toast('Запрос передан компании');
    },
    remindPdd: () => { S.pddReminded = true; log('coordinator', 'Напомнил Pinduoduo открыть ссылку визита (WeChat и почта).'); toast('Напоминание отправлено'); },
    remindIgor: () => { S.igorReminded = true; log('coordinator', 'Напомнил Игорю Белову загрузить билет.'); toast('Игорь Белов получил напоминание'); },
    openCompany: (id) => { S.sheet = { type: 'company', id }; },
    showQr: () => { S.sheet = { type: 'qr' }; },
    tpl: (k) => { const t = TEMPLATES.find((x) => x.key === k); S.annTpl = k; S.annText = t.ru; },
    sendAnn: () => {
      const text = (S.annText || '').trim();
      if (!text) return toast('Напишите текст объявления');
      if (!S.annTo.d && !S.annTo.h && !S.annTo.tg) return toast('Выберите, кому отправить');
      const t = TEMPLATES.find((x) => x.ru === text);
      S.announcements.unshift({ id: nid(), ru: text, zh: t ? t.zh : `（原型：中文译文）${text}`, en: t ? t.en : `(prototype: English translation) ${text}`, toD: S.annTo.d, toH: S.annTo.h, tg: S.annTo.tg, time: now() });
      if (S.annTo.d) S.dNotices.unshift({ text: `Объявление: ${text}`, time: now(), tone: 'warn' });
      log('coordinator', `Объявление «${text.slice(0, 40)}${text.length > 40 ? '…' : ''}» → ${[S.annTo.d && 'делегатам', S.annTo.h && 'JD.com по-китайски', S.annTo.tg && 'в Telegram'].filter(Boolean).join(', ')}.`);
      toast('Объявление отправлено');
    },

    // компания
    hostPropose: () => { S.form.propNote = ''; S.sheet = { type: 'hostPropose', start: '11:00' }; },
    submitPropose: () => {
      const note = (S.form.propNote || '').trim();
      S.jd.proposal = { start: S.sheet.start, note };
      S.jd.status = 'time_proposed';
      S.sheet = null;
      log('host', `JD.com предложила ${S.jd.proposal.start} вместо ${S.jd.start} → у координатора на пульте «Принять / Оставить».`);
      toast(H[S.lang].sent);
    },
    hostUpload: () => { S.sheet = { type: 'hostUpload' }; },
    submitUpload: (i) => {
      const f = HOST_FILES[Number(i)];
      if (S.materials.some((m) => m.name === f.name)) { S.sheet = null; return toast(S.lang === 'en' ? 'This file is already uploaded' : '该文件已上传'); }
      S.materials.push({ id: nid(), name: f.name, size: f.size, status: 'review' });
      S.sheet = null;
      log('host', `JD.com загрузила «${f.name}» → у координатора «Открыть делегатам».`);
      toast(S.lang === 'en' ? 'Uploaded, under review' : '已上传，等待协调人审核');
    },
    hostReply: () => { S.form.replyText = ''; S.sheet = { type: 'hostReply', to: '' }; },
    submitReply: () => {
      const text = (S.form.replyText || '').trim();
      if (!text) return toast(S.lang === 'en' ? 'Write a reply' : '请输入回复内容');
      const to = S.sheet.to;
      S.replies.push({ id: nid(), text, toName: to ? byId[to].ru : '', forwarded: false });
      S.sheet = null;
      log('host', `JD.com ответила${to ? ` ${byId[to].ru}` : ' группе'} → координатор переведёт и перешлёт.`);
      toast(H[S.lang].sent);
    },
    hostContact: (id) => { S.sheet = { type: 'contact', id }; },
    hostSubscribe: () => { S.hostSubscribed = true; log('host', 'JD.com включила напоминания WeChat → получит уведомление, когда автобус выедет.'); toast(S.lang === 'en' ? 'Reminders on' : '已开启提醒'); },
    hostWechat: () => toast(H[S.lang].wxCopied),
    hostCall: () => toast(H[S.lang].call),
    hostDownload: () => { log('host', 'JD.com скачала список гостей для охраны (имена латиницей, без паспортов).'); toast(H[S.lang].downloaded); },
    copyText: (text) => {
      const done = () => toast(H[S.lang].copied);
      try { navigator.clipboard.writeText(text).then(done, done); } catch (e) { done(); }
    },
  };

  document.addEventListener('click', (e) => {
    const roleBtn = e.target.closest('[data-role]');
    if (roleBtn) { S.role = roleBtn.dataset.role; S.viewAs = null; S.sheet = null; render(); return; }
    const el = e.target.closest('[data-act]');
    if (!el || !screenEl.contains(el)) return;
    const act = el.dataset.act;
    if (el.classList.contains('shade') && act === 'closeSheet') { S.sheet = null; render(); return; }
    if (S.viewAs && !NAV.has(act)) { toast('Режим просмотра: действие делает сам ' + (S.viewAs === 'delegate' ? 'делегат' : 'JD.com')); render(); return; }
    const fn = A[act];
    if (!fn) return;
    fn(el.dataset.arg || '');
    render();
  });
  document.addEventListener('input', (e) => {
    const f = e.target.dataset.field;
    if (!f) return;
    if (f === 'annText') { S.annText = e.target.value; S.annTpl = null; } else S.form[f] = e.target.value;
    save();
  });
  document.addEventListener('change', (e) => {
    const c = e.target.dataset.check;
    if (!c) return;
    if (c === 'consent') { S.sheet.consent = e.target.checked; return; }
    if (c === 'reviewConsent') { S.reviewConsent = e.target.checked; save(); return; }
    S.annTo[c] = e.target.checked;
    save();
  });
  document.getElementById('reset').addEventListener('click', () => { S = fresh(); render(); });

  render();
})();
</script>
