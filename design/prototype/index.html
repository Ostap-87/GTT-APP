<title>Прототип приложения GTT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Sofia+Sans+Extra+Condensed:wght@800&display=swap">
<style>
/* Раскладка: слева пульт демо (роли, что попробовать, журнал связей), справа телефон с приложением;
   на узком экране — переключатель ролей, телефон, затем журнал. Экран приложения всегда светлый, как в макетах. */
:root {
  --page-bg: #eef1f6;
  --page-fg: #0f1b2d;
  --page-muted: #5b6576;
  --panel: #ffffff;
  --panel-line: #dfe4ec;
  --accent: #1a73e8;
  --accent-ink: #1558b8;
  --accent-soft: #e8f0fe;
  --on-accent: #ffffff;
  --device: #0f1b2d;
  --font-display: 'Sofia Sans Extra Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-ui: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-cjk: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;

  --a-bg: #f4f6fa;
  --a-card: #ffffff;
  --a-ink: #0f1b2d;
  --a-muted: #5b6576;
  --a-line: #e3e7ef;
  --a-line2: #eef1f6;
  --a-blue: #1a73e8;
  --a-blue-ink: #1558b8;
  --a-blue-soft: #e8f0fe;
  --a-ok: #1e6b45;
  --a-ok-soft: #e3f3ea;
  --a-warn: #a2470a;
  --a-warn-soft: #fff1e6;
  --a-warn-line: #ffd2b0;
  --a-orange: #ffb27a;
  --a-green: #1e8e5a;
  --a-dark: #0f1b2d;
  --a-dark-2: #233350;
  --a-on-dark: #c9d4e8;
  --a-red: #c5321b;
  --a-red-soft: #fdecea;
  --a-shade: rgba(15, 27, 45, 0.45);
  --a-map: #eef1ea;
  --a-map-road: #ffffff;
  --a-map-water: #cfe2f3;
  --a-map-park: #dde9cf;
  --a-shop: #1a73e8;
  --a-night: #7b4fd6;
  --a-store: #1e8e5a;
  --a-wc: #d9822b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page-bg: #0b1220; --page-fg: #e6ebf4; --page-muted: #97a3b6; --panel: #121b2e; --panel-line: #24304a;
    --accent: #6aa3ff; --accent-ink: #9cc2ff; --accent-soft: #1b2a47; --on-accent: #0b1220; --device: #02060f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page-bg: #0b1220; --page-fg: #e6ebf4; --page-muted: #97a3b6; --panel: #121b2e; --panel-line: #24304a;
  --accent: #6aa3ff; --accent-ink: #9cc2ff; --accent-soft: #1b2a47; --on-accent: #0b1220; --device: #02060f; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--page-bg); color: var(--page-fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible, [data-act]:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page { max-width: 1120px; margin: 0 auto; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand .eyebrow { font-family: var(--font-display); font-weight: 800; letter-spacing: 1.2px; font-size: 17px; color: var(--accent-ink); }
.brand h1 { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; }
.roles { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--panel); border: 1px solid var(--panel-line); flex-wrap: wrap; }
.roles button { border: 0; background: transparent; color: var(--page-fg); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; }
.roles button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card-side { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-side h2 { margin: 0; font-size: 15px; font-weight: 700; }
.who { display: flex; flex-direction: column; gap: 4px; }
.who .name { font-size: 18px; font-weight: 700; }
.who p { margin: 0; color: var(--page-muted); max-width: 60ch; }
.tips { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; font-size: 13px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tag.delegate { background: var(--accent-soft); color: var(--accent-ink); }
.tag.coordinator { background: var(--page-fg); color: var(--page-bg); }
.tag.host { background: #e3f3ea; color: #1e6b45; }
.tag.agent { background: #f1e8fd; color: #6b2fa3; }
.seats { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--a-muted); }
.seats .bar { flex: 1; height: 6px; }
.field select { width: 100%; border: 1px solid #d5dbe6; border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px; color: var(--a-ink); background: var(--a-card); }
.cos { display: flex; flex-wrap: wrap; gap: 6px; }
.cos span { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 8px; background: var(--a-line2); color: var(--a-ink); }
.kvr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px dashed var(--a-line); font-size: 13.5px; }
.kvr.first { border-top: 0; }
.kvr .empty { color: var(--a-muted); font-style: italic; }
.blk-n { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: var(--a-dark); color: #ffffff; font-size: 12px; font-weight: 700; align-items: center; justify-content: center; margin-right: 8px; flex: none; }
.blk-h { display: flex; align-items: center; margin: 0; font-size: 15px; font-weight: 700; }
.cit { display: grid; grid-template-columns: minmax(0, 1fr) 72px 34px; gap: 6px; align-items: center; }
.cit select, .cit input { border: 1px solid #d5dbe6; border-radius: 10px; padding: 9px 10px; font: inherit; font-size: 14px; color: var(--a-ink); background: var(--a-card); width: 100%; }
.tz { background: var(--a-bg); border: 1px solid var(--a-line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.tz h4 { margin: 8px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--a-muted); }
.tz h4:first-child { margin-top: 0; }
.tz table { width: 100%; border-collapse: collapse; font-size: 13px; }
.tz td { padding: 4px 0; border-top: 1px solid var(--a-line2); vertical-align: top; }
.tz td:last-child { text-align: right; }
.log .empty { color: var(--page-muted); display: block; }
.reset { align-self: flex-start; border: 1px solid var(--panel-line); background: transparent; color: var(--page-muted); border-radius: 10px; padding: 6px 12px; font-size: 13px; }
.note-small { color: var(--page-muted); font-size: 12.5px; margin: 0; }

/* ——— Телефон ——— */
.device { width: 390px; max-width: 100%; height: 820px; border: 10px solid var(--device); border-radius: 46px; overflow: hidden; position: relative; background: var(--a-bg); color: var(--a-ink); box-shadow: 0 30px 60px -30px rgba(15, 27, 45, .45); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; font-family: var(--font-ui); font-size: 14px; }
.screen.cjk { font-family: var(--font-ui), var(--font-cjk); }
.statusbar { flex: none; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 13px; font-weight: 600; background: var(--a-card); color: var(--a-ink); }
.statusbar.dark { background: var(--a-dark); color: #ffffff; }
.statusbar .icons { display: flex; gap: 5px; align-items: center; }
.statusbar .bat { width: 22px; height: 11px; border: 1.5px solid currentColor; border-radius: 3px; position: relative; }
.statusbar .bat::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: currentColor; border-radius: 1px; }
.wxbar { flex: none; height: 44px; background: var(--a-card); display: flex; align-items: center; justify-content: center; position: relative; font-weight: 600; font-size: 16px; color: var(--a-ink); }
.capsule { position: absolute; right: 8px; top: 6px; width: 86px; height: 32px; border: 1px solid var(--a-line); border-radius: 16px; display: flex; align-items: center; justify-content: space-around; font-size: 15px; color: var(--a-ink); background: var(--a-card); }
.viewas { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 14px; background: var(--a-orange); color: var(--a-ink); font-size: 12.5px; font-weight: 600; }
.viewas button { border: 0; background: var(--a-ink); color: #ffffff; border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 700; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.tabbar { flex: none; display: grid; background: var(--a-card); border-top: 1px solid var(--a-line); padding: 6px 2px 18px; }
.tabbar button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--a-muted); padding: 4px 0; position: relative; }
.tabbar button[aria-current="page"] { color: var(--a-blue); font-weight: 700; }
.tabbar .badge { position: absolute; top: 0; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--a-red); color: #ffffff; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.ico { width: 22px; height: 22px; flex: none; }

.head { background: var(--a-card); padding: 14px 18px 14px; border-bottom: 1px solid var(--a-line); display: flex; flex-direction: column; gap: 6px; }
.head.dark { background: var(--a-dark); color: #ffffff; border-bottom: 0; }
.head .eyebrow { font-size: 12px; font-weight: 600; color: var(--a-muted); }
.head.dark .eyebrow { color: var(--a-orange); text-transform: uppercase; letter-spacing: .6px; font-weight: 700; }
.head h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: .95; text-transform: uppercase; letter-spacing: .3px; }
.head h2.plain { font-family: inherit; text-transform: none; font-size: 22px; font-weight: 700; line-height: 1.25; letter-spacing: 0; }
.head .row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.wxbrand { font-family: var(--font-display); font-weight: 800; letter-spacing: 1px; font-size: 15px; color: var(--a-blue-ink); }
.sub { font-size: 13px; color: var(--a-muted); }
.lang { display: flex; padding: 2px; border-radius: 8px; background: var(--a-line2); }
.lang button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--a-muted); }
.lang button[aria-pressed="true"] { background: var(--a-card); color: var(--a-ink); font-weight: 700; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 3px; border-radius: 10px; background: var(--a-dark-2); }
.seg button { border: 0; background: transparent; color: #ffffff; border-radius: 8px; height: 30px; font-size: 12.5px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: #ffffff; color: var(--a-ink); font-weight: 700; }
.seg.light { background: var(--a-line2); }
.seg.light button { color: var(--a-ink); }

.body { padding: 12px 14px 20px; display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--a-card); border: 1px solid var(--a-line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.card.dark { background: var(--a-dark); border-color: var(--a-dark); color: #ffffff; }
.card.warn { background: #fff8f2; border-color: var(--a-warn-line); }
.card.info { background: var(--a-blue-soft); border-color: var(--a-blue-soft); color: var(--a-blue-ink); }
.card h3 { margin: 0; font-size: 15px; font-weight: 700; }
.card .title-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.muted { color: var(--a-muted); font-size: 12.5px; }
.card.dark .muted { color: var(--a-on-dark); }
.big { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: .3px; }
.chip { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.ok { color: var(--a-ok); background: var(--a-ok-soft); }
.chip.warn { color: var(--a-warn); background: var(--a-warn-soft); }
.chip.info { color: var(--a-blue-ink); background: var(--a-blue-soft); }
.chip.dark { color: #ffffff; background: var(--a-dark); }
.chip.new { color: #ffffff; background: var(--a-red); }
.btn { border: 0; border-radius: 12px; height: 42px; padding: 0 14px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.full { width: 100%; }
.btn.primary { background: var(--a-blue); color: #ffffff; }
.btn.ghost { background: var(--a-card); color: var(--a-ink); border: 1px solid #d5dbe6; }
.btn.light { background: var(--a-blue-soft); color: var(--a-blue-ink); }
.btn.green { background: var(--a-green); color: #ffffff; }
.btn.white { background: #ffffff; color: var(--a-ink); }
.btn.dashed { background: var(--a-card); color: var(--a-blue-ink); border: 1.5px dashed var(--a-blue); }
.btn.small { height: 34px; padding: 0 11px; font-size: 12.5px; border-radius: 10px; }
.btn.done { background: var(--a-ok-soft); color: var(--a-ok); }
.btn[disabled] { opacity: .5; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns.split > * { flex: 1 1 0; }
.icon-btn { width: 38px; height: 38px; border-radius: 19px; border: 0; background: var(--a-blue-soft); color: var(--a-blue-ink); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--a-line2); }
.li:first-child { border-top: 0; padding-top: 2px; }
.li.two { grid-template-columns: minmax(0, 1fr) auto; }
.li .t { font-weight: 600; font-size: 14px; }
.li .s { color: var(--a-muted); font-size: 12.5px; }
.tap { cursor: pointer; }
.avatar { width: 38px; height: 38px; border-radius: 19px; background: #dbe7fd; color: var(--a-blue-ink); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex: none; }
.avatar.blue { background: var(--a-blue); color: #ffffff; }
.time { font-weight: 700; font-variant-numeric: tabular-nums; width: 46px; }
.time.moved { color: var(--a-warn); }
.kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 10px; font-size: 13.5px; }
.kv .k { color: var(--a-muted); }
.days { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.days button { border: 1px solid var(--a-line); background: var(--a-card); color: var(--a-ink); border-radius: 12px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 0; }
.days button .n { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.05; }
.days button .w, .days button .c { font-size: 10.5px; color: var(--a-muted); }
.days button[aria-pressed="true"] { background: var(--a-blue); border-color: var(--a-blue); color: #ffffff; }
.days button[aria-pressed="true"] .w, .days button[aria-pressed="true"] .c { color: #dbe7fd; }
.bar { height: 8px; border-radius: 4px; background: var(--a-line2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--a-green); border-radius: 4px; transition: width .3s; }
.check { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--a-line2); }
.check:first-child { border-top: 0; }
.box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #c3cbd8; display: flex; align-items: center; justify-content: center; color: #ffffff; }
.box.on { background: var(--a-green); border-color: var(--a-green); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { border: 1px solid #d5dbe6; background: var(--a-card); color: var(--a-ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.pick[aria-pressed="true"] { background: var(--a-dark); border-color: var(--a-dark); color: #ffffff; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--a-muted); }
.field textarea, .field input { width: 100%; border: 1px solid #d5dbe6; border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px; font-weight: 400; color: var(--a-ink); background: var(--a-card); resize: none; }
.toggle-row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.toggle-row label { display: flex; align-items: center; gap: 6px; }
.toggle-row input { width: 18px; height: 18px; accent-color: var(--a-blue); }
.stars { display: flex; gap: 6px; }
.stars button { border: 0; background: transparent; font-size: 26px; line-height: 1; color: #c3cbd8; padding: 0; }
.stars button.on { color: #f2a33a; }
.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--a-card); border: 1px solid var(--a-line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat.dark { background: var(--a-dark); border-color: var(--a-dark); color: #ffffff; }
.stat.dark .muted { color: var(--a-on-dark); }
.qr { width: 180px; height: 180px; align-self: center; }
.file-badge { width: 40px; height: 40px; border-radius: 10px; background: var(--a-red-soft); color: var(--a-red); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
.empty-state { padding: 40px 20px; text-align: center; color: var(--a-muted); }

.shade { position: absolute; inset: 0; background: var(--a-shade); z-index: 5; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--a-card); border-radius: 22px 22px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 12px; max-height: 86%; overflow-y: auto; color: var(--a-ink); }
.sheet .grip { width: 40px; height: 5px; border-radius: 3px; background: #d5dbe6; align-self: center; }
.sheet h3 { margin: 0; font-size: 17px; font-weight: 700; }
.toast { position: absolute; left: 14px; right: 14px; top: 92px; z-index: 8; background: var(--a-dark); color: #ffffff; border-radius: 14px; padding: 12px 14px; font-size: 13.5px; font-weight: 500; box-shadow: 0 10px 30px -10px rgba(15, 27, 45, .5); animation: drop .25s ease-out; }
.toast .from { display: block; font-size: 11px; font-weight: 700; color: var(--a-orange); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
@keyframes drop { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
.eq { display: flex; gap: 5px; align-items: flex-end; height: 36px; }
.eq span { width: 6px; height: 10px; border-radius: 3px; background: var(--a-orange); animation: eq 1s ease-in-out infinite; }
.eq span:nth-child(2) { animation-delay: .15s; } .eq span:nth-child(3) { animation-delay: .3s; } .eq span:nth-child(4) { animation-delay: .45s; } .eq span:nth-child(5) { animation-delay: .6s; } .eq span:nth-child(6) { animation-delay: .75s; }
@keyframes eq { 0%, 100% { height: 8px; } 50% { height: 34px; } }
.chat { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
.bubble { padding: 9px 12px; border-radius: 14px; max-width: 86%; display: flex; flex-direction: column; gap: 2px; font-family: var(--font-ui), var(--font-cjk); }
.bubble.me { align-self: flex-end; background: var(--a-blue); color: #ffffff; }
.bubble.them { align-self: flex-start; background: var(--a-line2); color: var(--a-ink); }
.bubble .tr { font-size: 12.5px; opacity: .85; }
.range { width: 100%; accent-color: var(--a-blue); }
.qa { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.qa .btn { height: 46px; }

      body = `<section class="card"><h3>День 2 из 6</h3><div class="bar"><span style="width:33%"></span></div><span class="muted">Пройдено визитов: 0 из 9 · сегодня JD.com и Meituan</span></section>
        <section class="card"><h3>Культурная программа</h3><div class="list">${Object.entries(CULTURE).map(([k, c]) => `<div class="li two tap" data-act="openCulture" data-arg="${k}"><div><div class="t">${esc(c.title)}</div><div class="s">${esc(c.when)}</div></div><span class="chip dark">культура</span></div>`).join('')}</div></section>
        <section class="card"><h3>Мои вопросы к компаниям</h3>${S.questions.length ? S.questions.map((q) => `<div class="li two"><div><div>${esc(q.ru)}</div><div class="s">${q.company} · ${q.status === 'sent' ? 'переведено и отправлено' : 'ждёт перевода координатором'}</div></div></div>`).join('') : '<span class="muted">Пока нет. Задайте их на вкладке «До».</span>'}</section>`;
    } else {
      const r = S.myRating;
      const stars = [1, 2, 3, 4, 5].map((n) => `<button type="button" class="${n <= r ? 'on' : ''}" data-act="rate" data-arg="${n}" aria-label="${n} из 5">★</button>`).join('');
      const sent = S.reviews.length > 0;
      const mode = S.reviewMode;
      const review = sent
        ? `<div class="card info" style="padding:10px 12px">Спасибо! Отзыв${S.reviews[0].video ? ' (видео)' : ''} у координатора.</div>`
        : `<div class="seg light">${[['text', 'Текстом'], ['video', 'Видео']].map(([k, l]) => `<button type="button" data-act="reviewMode" data-arg="${k}" aria-pressed="${mode === k}">${l}</button>`).join('')}</div>
          ${mode === 'text'
    ? `<label class="field" for="reviewText">Ваш отзыв<textarea id="reviewText" rows="4" data-field="reviewText" placeholder="Что было самым полезным? Что улучшить?">${esc(S.form.reviewText || '')}</textarea></label>`
    : (S.videoAttached
      ? `<div class="card" style="background:var(--a-bg);flex-direction:row;align-items:center;gap:10px">${icon('video', 26)}<div style="flex:1"><div class="t" style="font-weight:600">Видео 0:48 записано</div><div class="muted">Можно переснять</div></div>${btn('recordVideo', 'Переснять', 'ghost small')}</div>`
      : `${btn('recordVideo', `${icon('video', 18)} Записать видео до 2 минут`, 'dashed full')}<span class="muted">Или загрузите готовое видео из галереи.</span>`)}
          <div class="toggle-row"><label><input id="reviewConsent" type="checkbox" data-check="reviewConsent" ${S.reviewConsent ? 'checked' : ''}> Разрешаю Global Tech Tour опубликовать отзыв на сайте и в соцсетях</label></div>
          ${btn('sendReview', 'Отправить отзыв', 'primary full')}`;
      body = `<section class="card"><h3>Отзыв о поездке</h3>${review}</section>
        <section class="card"><h3>Оцените визит в JD.com</h3><div class="stars">${stars}</div><span class="muted">${r ? 'Спасибо! Компания увидит общую оценку группы, без имён.' : 'Компания видит только общую оценку группы.'}</span></section>
        <section class="card"><h3>Хочу продолжить</h3><span class="muted">Образцы, переговоры, повторная встреча — координатор передаст компании.</span>${btn('followup', 'Оставить запрос', 'primary full')}
          ${S.followups.map((f) => `<div class="li two"><div><div class="t">${f.company} · ${esc(f.typeRu)}</div><div class="s">${f.status === 'new' ? 'у координатора' : 'передано компании'}</div></div></div>`).join('')}</section>
        <section class="card"><h3>Фото, видео и отчёт</h3><span class="muted">Откроются 14 ноября, после возвращения группы.</span></section>`;
    }
    return `${delegateHead(`${me.ru} · делегат`, 'Моя поездка')}<div class="body">${seg}${body}</div>`;
  }

  // ——— Координатор ———
  function coordHead(title) {
    const va = S.viewAs;
    return `<header class="head dark"><div class="row-between"><span class="eyebrow">Координатор · полный доступ</span><span class="muted" style="color:var(--a-on-dark)">09:05</span></div><h2>${title}</h2>
      <div class="seg" role="group" aria-label="Смотреть как"><button type="button" data-act="viewAs" data-arg="" aria-pressed="${!va}">Я</button><button type="button" data-act="viewAs" data-arg="delegate" aria-pressed="${va === 'delegate'}" aria-label="Как делегат">Делегат</button><button type="button" data-act="viewAs" data-arg="host" aria-pressed="${va === 'host'}" aria-label="Как JD.com">JD.com</button><button type="button" data-act="viewAs" data-arg="agent" aria-pressed="${va === 'agent'}" aria-label="Как агент">Агент</button></div></header>`;
  }
  function kCenter() {
    const c = companies();
    const conf = c.filter((x) => x.st[0] === 'ok').length;
    const att = attention();
    const missing = S.missing.map((id) => { const d = byId[id]; return `<div class="li"><span class="avatar">${initials(d.lat)}</span><div class="t">${d.ru}</div><div class="btns"><button type="button" class="icon-btn" data-act="fakeCall" data-arg="${d.ru}" aria-label="Позвонить: ${d.ru}">${icon('phone', 18)}</button>${btn('markBus', 'В автобусе', 'ghost small', id)}</div></div>`; }).join('');
    return `${coordHead('Новый ритейл · день 2')}<div class="body">
      <div class="stat-grid">
        <div class="stat dark"><span class="muted">В автобусе</span><span class="v">${busCount()} / 18</span><span class="muted">выезд в 09:30</span></div>
        <div class="stat"><span class="muted">Визиты подтверждены</span><span class="v">${conf} / 9</span><span class="muted">${c.filter((x) => x.st[0] !== 'ok').map((x) => x.name.split(' ')[0]).join(', ') || 'все'}</span></div>
        <div class="stat"><span class="muted">Вопросы компаниям</span><span class="v">${41 + S.addedQ}</span><span class="muted">${38 + S.translatedQ} переведено</span></div>
        <div class="stat"><span class="muted">Документы</span><span class="v">${18 - S.docsMissing.length} / 18</span><span class="muted">${S.docsMissing.length ? `${S.docsMissing.length} ждём` : 'все на месте'}</span></div>
      </div>
      <section class="card"><div class="title-row"><h3>Сбор группы · автобус №2</h3><span class="big" style="font-size:28px">${busCount()}/18</span></div><div class="bar"><span style="width:${busCount() / 18 * 100}%"></span></div>
        ${S.missing.length ? `<div class="list">${missing}</div>` : '<span class="muted">Все в автобусе.</span>'}
        ${S.departed ? '<span class="chip ok" style="align-self:flex-start">Автобус выехал · JD.com знает: прибытие ~10:25</span>' : btn('depart', 'Автобус выехал — сообщить JD.com', 'primary full')}</section>
      <section class="card"><div class="title-row"><h3 style="display:flex;gap:6px;align-items:center">${icon('headphones', 18)} Радиогид для группы</h3>${S.guideLive ? '<span class="chip new">в эфире</span>' : ''}</div>
        ${S.guideLive ? `<span class="muted">Говорит Ли Мэй · слушают ${11 + (S.listening ? 1 : 0)} из 18</span>${btn('stopBroadcast', 'Остановить трансляцию', 'ghost full')}` : `<span class="muted">Переводчик или гид говорит в свой телефон, группа слушает в своих наушниках.</span>${btn('startBroadcast', 'Начать трансляцию', 'primary full')}`}</section>
      ${S.out ? `<section class="card info"><div class="t" style="font-weight:700">Свободное время</div><span>Гуляет самостоятельно: ${me.ru}, вернётся до ${esc(S.out.back)}</span></section>` : ''}
      <section class="card"><div class="title-row"><h3>Требует внимания</h3><span class="chip ${att.length ? 'warn' : 'ok'}">${att.length || 'всё решено'}</span></div>
        <div class="list">${att.map((a) => `<div class="li two"><div style="display:flex;flex-direction:column;gap:6px"><div class="t">${esc(a.title)}</div>${a.sub ? `<div class="s">${esc(a.sub)}</div>` : ''}<div class="btns">${a.btns.map(([act, l, k, arg]) => btn(act, esc(l), `${k} small`, arg || '')).join('')}</div></div></div>`).join('') || '<span class="muted">Новых дел нет.</span>'}</div></section>
    </div>`;
  }
  function kVisits() {
    const rows = companies().map((c) => `<div class="li tap" data-act="openCompany" data-arg="${c.id}"><span class="avatar" style="border-radius:10px">${c.name.slice(0, 2).toUpperCase()}</span><div><div class="t">${esc(c.name)}</div><div class="s">${c.when}</div></div><span class="chip ${c.st[0]}">${esc(c.st[1])}</span></div>`).join('');
    const conf = companies().filter((x) => x.st[0] === 'ok').length;
    return `${coordHead(`Визиты · ${conf} из 9`)}<div class="body"><section class="card"><div class="list">${rows}</div></section>
      <p class="muted">Нажмите на компанию: ссылка визита, QR-код приглашения, что она видит.</p></div>`;
  }
  function kGroup() {
    const rows = D.map((d) => {
      const inBus = !S.missing.includes(d.id);
      const doc = S.docsMissing.includes(d.id);
      return `<div class="li"><span class="avatar">${initials(d.lat)}</span><div><div class="t">${d.ru}</div><div class="s">${d.roleRu} · ${d.coRu}</div></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${inBus ? '<span class="chip ok">в автобусе</span>' : '<span class="chip warn">нет в автобусе</span>'}${doc ? `<span class="chip warn">${d.id === 'd4' ? 'нет билета' : 'нет паспорта'}</span>` : ''}${d.id === 'd1' && S.diet ? `<span class="chip info">${esc(S.diet)}</span>` : ''}${d.id === 'd1' && S.out ? `<span class="chip dark">гуляет · до ${esc(S.out.back)}</span>` : ''}</div></div>`;
    }).join('');
    return `${coordHead('Группа · 18')}<div class="body"><section class="card"><div class="list">${rows}</div></section></div>`;
  }
  function kLeads() {
    const row = (x, agency, mine) => {
      const t = tourById[x.tour];
      const st = AG_ST[x.status];
      const acts = !mine ? '' : x.status === 'new' ? `<div class="btns">${btn('agTake', 'Взять в работу', 'primary small', x.id)}${btn('agConfirm', 'Подтвердить', 'ghost small', x.id)}</div>`
        : x.status === 'work' ? `<div class="btns">${btn('agConfirm', 'Подтвердить', 'primary small', x.id)}</div>` : '';
      return `<div class="li two"><div style="display:flex;flex-direction:column;gap:4px"><div class="t">${esc(t[2])}</div><div class="s">${esc(agency)} · ${esc(x.dates)} · ${x.people} чел.${x.cit ? ` · ${esc(CIS_RU[x.cit])}` : ''}</div><div class="s">${esc(x.client)}</div>${acts}</div><span class="chip ${st[0]}">${st[1]}</span></div>`;
    };
    const all = S.agentApps.map((x) => row(x, AGENCY, true)).join('') + OTHER_LEADS.map((x) => row(x, x.agency, false)).join('');
    const n = S.agentApps.filter((x) => x.status !== 'confirmed').length + OTHER_LEADS.filter((x) => x.status !== 'confirmed').length;
    const calcRows = S.calcReqs.map((r) => { const st = CALC_ST[r.status]; return `<div class="li two tap" data-act="calcOpen" data-arg="${r.id}"><div><div class="t">${r.id} · ${esc(calcTitle(r))}</div><div class="s">${AGENCY} · ${r.people} чел. · ${esc(citLine(r.cit))}</div><div class="s">${esc(r.dates || 'даты не указаны')} · ответ: ${esc(r.due)}</div></div><span class="chip ${st[0]}">${st[1]}</span></div>`; }).join('');
    return `${coordHead(`Заявки · ${n + S.calcReqs.filter((r) => r.status !== 'done').length} в работе`)}<div class="body">
      <section class="card"><div class="title-row"><h3>Запросы на расчёт</h3><span class="chip info">${S.calcReqs.length}</span></div><div class="list">${calcRows}</div><span class="muted">Нажмите — откроется ТЗ, собранное из блоков агента.</span></section>
      <section class="card"><div class="title-row"><h3>Агенты и сайт</h3><span class="chip info">${S.agentApps.length + OTHER_LEADS.length}</span></div><div class="list">${all}</div></section>
      <p class="muted">Заявки агентов и с формы сайта — в одном списке; о новой приходит сообщение в Telegram. Подтверждённая заявка занимает места в выезде.</p></div>`;
  }
  function kAnnounce() {
    const tpl = TEMPLATES.map((t) => `<button type="button" class="pick" data-act="tpl" data-arg="${t.key}" aria-pressed="${S.annTpl === t.key}">${t.label}</button>`).join('');
    const sent = S.announcements.slice(0, 4).map((a) => `<div class="li two"><div><div>${esc(a.ru)}</div><div class="s">${a.time} · ${[a.toD && 'делегатам', a.toH && 'JD.com по-китайски', a.tg && 'Telegram'].filter(Boolean).join(', ')}</div></div></div>`).join('');
    return `${coordHead('Объявление')}<div class="body">
      <section class="card"><h3>Быстрые шаблоны</h3><div class="chips">${tpl}</div>
        <label class="field" for="annText">Текст<textarea id="annText" rows="3" data-field="annText">${esc(S.annText)}</textarea></label>
        <div class="toggle-row"><label><input id="toD" type="checkbox" data-check="d" ${S.annTo.d ? 'checked' : ''}> Делегатам (18)</label><label><input id="toH" type="checkbox" data-check="h" ${S.annTo.h ? 'checked' : ''}> JD.com (中文)</label><label><input id="toTg" type="checkbox" data-check="tg" ${S.annTo.tg ? 'checked' : ''}> Telegram</label></div>
        ${btn('sendAnn', 'Отправить', 'primary full')}</section>
      <section class="card"><h3>Отправлено</h3><div class="list">${sent}</div></section></div>`;
  }

  // ——— Агент (турагентства и агенты-партнёры) ———
  function agentHead(title) {
    return `<header class="head"><span class="eyebrow">Ирина Миронова · агентство ${AGENCY}</span><h2>${title}</h2></header>`;
  }
  function seatsLine(d) {
    const free = depFree(d);
    const chip = free === 0 ? '<span class="chip dark">группа набрана</span>' : free <= 4 ? `<span class="chip warn">осталось ${free}</span>` : `<span class="chip ok">${free} мест</span>`;
    return { free, chip, bar: `<div class="seats"><div class="bar"><span style="width:${(d.total - free) / d.total * 100}%"></span></div>${d.total - free} из ${d.total}</div>` };
  }
  function tourRow(t) {
    const deps = depsOf(t[0]).filter((d) => depFree(d) > 0);
    const next = deps[0];
    return `<div class="li two tap" data-act="agTour" data-arg="${t[0]}"><div><div class="t">${esc(t[2])}</div><div class="s">${COUNTRY_RU[t[1]]} · ${t[3]} ${plural(t[3], 'день', 'дня', 'дней')} · ${t[4]} ${plural(t[4], 'компания', 'компании', 'компаний')} · ${esc(t[5].slice(0, 4).join(' → '))}</div></div>${next ? `<span class="chip ok">${next.short}</span>` : '<span class="chip info">под группу</span>'}</div>`;
  }
  function aCatalog() {
    const c = S.ag.country;
    const counts = {};
    TOURS.forEach((t) => { counts[t[1]] = (counts[t[1]] || 0) + 1; });
    const chips = [['all', `Все · ${TOURS.length}`]].concat(COUNTRY_ORDER.map((k) => [k, `${COUNTRY_RU[k]} · ${counts[k] || 0}`]))
      .map(([k, l]) => `<button type="button" class="pick" data-act="agCountry" data-arg="${k}" aria-pressed="${c === k}">${l}</button>`).join('');
    const list = TOURS.filter((t) => c === 'all' || t[1] === c);
    const withDates = list.filter((t) => depsOf(t[0]).length);
    return `${agentHead('Каталог программ')}<div class="body">
      <section class="card"><div class="chips">${chips}</div></section>
      ${withDates.length ? `<section class="card"><div class="title-row"><h3>С ближайшими выездами</h3><span class="chip ok">${withDates.length}</span></div><div class="list">${withDates.map(tourRow).join('')}</div></section>` : ''}
      <section class="card"><div class="title-row"><h3>${c === 'all' ? 'Все программы' : COUNTRY_RU[c]}</h3><span class="chip info">${list.length}</span></div><div class="list">${list.filter((t) => !depsOf(t[0]).length).map(tourRow).join('')}</div></section>
      <p class="muted">Программы, маршруты и компании — с сайта globaltechtour.ru. Стоимость для агента и комиссия — в карточке программы (пока не указаны).</p></div>`;
  }
  function aDates() {
    const m = S.ag.month;
    const chips = MONTHS.map(([k, l]) => `<button type="button" class="pick" data-act="agMonth" data-arg="${k}" aria-pressed="${m === k}">${l}</button>`).join('');
    const months = Object.keys(MONTH_FULL).filter((k) => m === 'all' || m === k);
    const blocks = months.map((k) => {
      const rows = DEPS.filter((d) => d.month === k).map((d) => {
        const t = tourById[d.tour];
        const s = seatsLine(d);
        return `<div class="li two"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div class="tap" data-act="agTour" data-arg="${t[0]}"><div class="t">${esc(t[2])}</div><div class="s">${d.dates} · ${COUNTRY_RU[t[1]]} · ${t[3]} ${plural(t[3], 'день', 'дня', 'дней')}</div></div>${s.bar}</div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">${s.chip}${s.free ? btn('agApply', 'Заявка', 'primary small', `dep:${d.id}`) : ''}</div></div>`;
      }).join('');
      return rows ? `<section class="card"><h3>${MONTH_FULL[k]}</h3><div class="list">${rows}</div></section>` : '';
    }).join('');
    return `${agentHead('Выезды и места')}<div class="body">
      <section class="card"><div class="chips">${chips}</div></section>${blocks}
      <section class="card info"><div class="t" style="font-weight:700">Нужны другие даты?</div><span>Отправьте заявку с желаемыми датами и числом участников — координатор проверит, можно ли собрать программу под вашу группу.</span>${btn('agApply', 'Заявка на свои даты', 'primary full', '')}</section>
      <p class="muted">Даты и места в прототипе — пример; в приложении их ведёт координатор.</p></div>`;
  }
  function aCalc() {
    const c = S.calc;
    const f = S.form;
    const pick = (act, key, v, on) => `<button type="button" class="pick" data-act="${act}" data-arg="${key}|${esc(v)}" aria-pressed="${on}">${esc(v)}</button>`;
    const multi = (key, list) => list.map((v) => pick('calcToggle', key, v, c[key].includes(v))).join('');
    const one = (key, list) => list.map((v) => pick('calcSet', key, v, c[key] === v)).join('');
    const blk = (n, title, body, sub) => `<section class="card"><h3 class="blk-h"><span class="blk-n">${n}</span>${title}</h3>${sub ? `<span class="muted">${sub}</span>` : ''}${body}</section>`;
    const t = c.tour ? tourById[c.tour] : null;
    const opts = COUNTRY_ORDER.map((k) => `<optgroup label="${COUNTRY_RU[k]}">${TOURS.filter((x) => x[1] === k).map((x) => `<option value="${x[0]}" ${c.tour === x[0] ? 'selected' : ''}>${esc(x[2])}</option>`).join('')}</optgroup>`).join('');
    const b1 = c.mode === 'ready'
      ? blk(1, 'Готовая экспедиция', `<label class="field" for="cTour">Программа из каталога<select id="cTour" data-field="cTour"><option value="">Выберите программу</option>${opts}</select></label>
        ${t ? `<span class="muted">${COUNTRY_RU[t[1]]} · ${t[3]} ${plural(t[3], 'день', 'дня', 'дней')} · ${esc(t[5].join(' → '))} · ${t[4]} ${plural(t[4], 'компания', 'компании', 'компаний')}</span>` : ''}
        <label class="field" for="cChanges">Что поменять в программе (необязательно)<input id="cChanges" data-field="c_changes" value="${esc(f.c_changes || '')}" placeholder="Например: добавить завод BYD, убрать Шанхай"></label>`)
      : blk(1, 'Своя программа: направление', `<div class="s" style="font-weight:600;color:var(--a-muted)">Страна поездки</div><div class="chips">${COUNTRY_ORDER.map((k) => `<button type="button" class="pick" data-act="calcSet" data-arg="country|${k}" aria-pressed="${c.country === k}">${COUNTRY_RU[k]}</button>`).join('')}</div>
        <label class="field" for="cCities">Города (необязательно)<input id="cCities" data-field="c_cities" value="${esc(f.c_cities || '')}" placeholder="Например: Шанхай, Шэньчжэнь"></label>`);
    const b2 = c.mode === 'ready' ? '' : blk(2, 'Отрасли и компании', `<div class="s" style="font-weight:600;color:var(--a-muted)">Отрасли</div><div class="chips">${multi('sectors', SECTORS)}</div>
        <div class="s" style="font-weight:600;color:var(--a-muted)">Компании, которые хотят посетить</div>

        ${c.file ? '<span class="chip ok" style="align-self:flex-start">ТЗ клиента прикреплено · tz-klienta.pdf</span>' : btn('calcFile', `${icon('doc', 18)} Прикрепить ТЗ клиента`, 'ghost small')}`);
    return `${agentHead('Запрос на расчёт')}<div class="body">
      <div class="seg light" role="group" aria-label="Что считать"><button type="button" data-act="calcSet" data-arg="mode|ready" aria-pressed="${c.mode === 'ready'}">Готовая экспедиция</button><button type="button" data-act="calcSet" data-arg="mode|custom" aria-pressed="${c.mode === 'custom'}">Своя программа (ТЗ)</button></div>

  function aApps() {

    }).join('');
    setTimeout(() => { if (S.role === 'agent' && S.tab.agent === 'apps') { S.agentApps.forEach((x) => { x.upd = false; }); S.calcReqs.forEach((x) => { x.upd = false; }); save(); } }, 0);

      ${btn('agApply', `${icon('send', 18)} Новая заявка`, 'primary full', '')}

  // ——— Компания (мини-программа WeChat) ———
  function hostHead(title) {
    const L = H[S.lang];
    return `<header class="head"><div class="row-between"><span class="wxbrand">GLOBAL TECH TOUR</span>
      <div class="lang" role="group" aria-label="语言 Language"><button type="button" data-act="lang" data-arg="zh" aria-pressed="${S.lang === 'zh'}">中文</button><button type="button" data-act="lang" data-arg="en" aria-pressed="${S.lang === 'en'}">EN</button></div></div>

  }
  function hVisit() {
    const L = H[S.lang];
    const ann = S.announcements.find((a) => a.toH);
    const annText = ann ? (ann[S.lang] || ann.zh || ann.ru) : '';
    const status = S.jd.proposal ? `<span class="chip warn">${L.proposed}</span>` : `<span class="chip ok">${L.confirmed}</span>`;
    return `${hostHead(L.trip)}<div class="body">
      <section class="card dark" style="flex-direction:row;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:12px;background:var(--a-orange);color:var(--a-ink);display:flex;align-items:center;justify-content:center;flex:none">${icon('bus', 24)}</span>
        <div><div style="font-weight:700;font-size:16px">${S.departed ? L.departed : L.planned}</div><div class="muted">${S.departed ? L.eta : L.plannedSub}</div></div></section>
      ${ann ? `<section class="card warn"><span class="muted">${L.message} · ${esc(ann.time)}</span><div>${esc(annText)}</div></section>` : ''}
      <section class="card"><div class="title-row"><h3>${L.info}</h3>${status}</div>
        <div class="kv"><span class="k">${L.people}</span><span>${L.peopleV}</span><span class="k">${L.language}</span><span>${L.languageV}</span><span class="k">${L.industries}</span><span>${L.industriesV}</span><span class="k">${L.focus}</span><span>${L.focusV}</span></div>
        ${S.jd.proposal ? `<div class="card warn" style="padding:10px 12px">${esc(fill(L.proposalWait, { t: S.jd.proposal.start }))}</div>` : ''}</section>
      <section class="card"><h3>${L.program}</h3><div class="kv" style="grid-template-columns:52px minmax(0,1fr)"><strong>${S.jd.start}</strong><span>${L.p1}</span><strong>${shift(S.jd.start, 45)}</strong><span>${L.p2}</span><strong>${shift(S.jd.start, 105)}</strong><span>${L.p3}</span></div>
        ${S.jd.proposal ? '' : btn('hostPropose', L.propose, 'ghost full')}</section>
      <section class="card" style="flex-direction:row;align-items:center;gap:10px"><span class="avatar blue">OD</span><div style="flex:1;min-width:0"><div class="t" style="font-weight:700">Ostap Dotsenko</div><div class="muted">${L.coordinator}</div></div>${btn('hostWechat', L.wechat, 'green small')}<button type="button" class="icon-btn" data-act="hostCall" aria-label="${L.phone}">${icon('phone', 18)}</button></section>
      ${S.hostSubscribed ? `<section class="card info">${L.subscribed}</section>` : btn('hostSubscribe', L.subscribe, 'primary full')}
    </div>`;
  }
  function shift(t, minutes) {
    const [h, m] = t.split(':').map(Number);
    const total = h * 60 + m + minutes;
    return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
  }
  function hDelegation() {

  function qrSvg() {
    // Узор-заглушка в виде QR-кода (настоящий выдаёт WeChat по коду приглашения)
    let cells = '';
    let seed = 7;
    for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
      seed = (seed * 9301 + 49297) % 233280;
      const finder = (x < 7 && y < 7) || (x > 17 && y < 7) || (x < 7 && y > 17);
      if (finder) continue;
      if (seed / 233280 > 0.55) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }
    const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#0f1b2d"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#ffffff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#0f1b2d"/>`;
    return `<svg class="qr" viewBox="-2 -2 29 29" role="img" aria-label="QR-код приглашения"><rect x="-2" y="-2" width="29" height="29" fill="#ffffff"/><g fill="#0f1b2d">${cells}</g>${finder(0, 0)}${finder(18, 0)}${finder(0, 18)}</svg>`;
  }

    cityCat: (k) => { S.cityCat = k; S.place = null; },
    pickPlace: (id) => { S.place = id; S.sheet = { type: 'place', id }; },
    findMore: (cat) => toast(cat === 'wc' ? 'В приложении: все туалеты рядом с вами на карте Amap' : 'В приложении: все круглосуточные магазины рядом с вами на карте Amap'),
    taxi2: (dest) => { S.sheet = { type: 'taxi2', dest: dest || 'hotel' }; },
    callDidi: (zh) => {
      try { navigator.clipboard.writeText(zh).catch(() => {}); } catch (e) { /* без буфера обмена */ }
      log('delegate', `${me.ru} вызывает такси DiDi — адрес по-китайски подставлен.`);
      toast('В приложении откроется DiDi с этим адресом; адрес уже скопирован');
    },
    goOut: () => { S.sheet = { type: 'out', back: '23:00' }; },
    saveOut: () => { S.out = { back: S.sheet.back }; S.sheet = null; log('delegate', `${me.ru}: «Иду гулять» до ${S.out.back} → координатор видит в «Группе».`); toast('Координатор знает, что вы гуляете'); },
    backHome: () => { S.out = null; log('delegate', `${me.ru}: «Я в отеле» → координатор видит, что все вернулись.`); toast('Отлично, координатор видит, что вы в отеле'); },
    guide: () => { S.sheet = { type: 'guide' }; },
    speak: (lang) => {
      const list = PHRASES[lang];
      const [orig, tr] = list[S.tIdx[lang] % list.length];
      S.tIdx[lang] += 1;
      S.chat.push({ side: lang === 'ru' ? 'me' : 'them', orig, tr });
      if (S.chat.length === 1) log('delegate', `${me.ru} пользуется переводчиком: речь → текст и голос на другом языке.`);
    },
    listen: () => {
      S.listening = !S.listening;
      if (S.listening) log('delegate', `${me.ru} слушает гида в наушниках → у координатора «слушают ${12} из 18».`);
    },
    recordVideo: () => { S.videoAttached = true; toast('В прототипе запись имитируется: видео 0:48'); },
    sendReview: () => {
      const text = (S.form.reviewText || '').trim();
      const video = S.reviewMode === 'video' && S.videoAttached;
      if (S.reviewMode === 'text' && !text) return toast('Напишите пару слов о поездке');
      if (S.reviewMode === 'video' && !S.videoAttached) return toast('Сначала запишите видео');
      S.reviews.unshift({ id: nid(), text: S.reviewMode === 'text' ? text : '', video, consent: S.reviewConsent, status: 'new' });
      log('delegate', `${me.ru} оставила отзыв ${video ? 'видео' : 'текстом'}${S.reviewConsent ? ' с разрешением на публикацию' : ''} → у координатора на пульте.`);
      toast('Отзыв отправлен координатору');
    },
    download: (k) => { S.downloaded[k] = !S.downloaded[k]; if (S.downloaded[k]) toast('Скачано — откроется без интернета'); },
    addNote: () => { S.form.noteText = ''; S.sheet = { type: 'note' }; },
    submitNote: () => { const t = (S.form.noteText || '').trim(); if (!t) return toast('Напишите текст заметки'); S.notes.unshift({ text: t, time: 'сейчас' }); S.sheet = null; toast('Заметка сохранена · видите только вы'); },
    intro: (id) => { S.intros[id] = true; log('delegate', `Запрос на знакомство: ${me.ru} → ${byId[id].ru}. Контакты откроются, если он согласится.`); toast(`${byId[id].ru} получит запрос на знакомство`); },
    fakeCall: (who) => toast(`В прототипе звонка нет — в приложении наберёт ${who}`),
    fakeMsg: (who) => toast(`В прототипе сообщения нет — в приложении откроется чат с ${who}`),
    tick: (k) => { S.checklist[k] = !S.checklist[k]; },
    askQ: (company) => { S.form.qText = ''; S.sheet = { type: 'question', company: ['JD.com', 'Meituan', 'Hema (Freshippo)'].includes(company) ? company : 'JD.com', pick: null }; },
    submitQ: () => {
      const sh = S.sheet;
      const own = (S.form.qText || '').trim();
      if (sh.pick == null && !own) return toast('Выберите вопрос или напишите свой');
      const base = sh.pick != null ? SUGGESTED_Q[sh.pick] : { ru: own, zh: `（原型：此处为协调人翻译的中文）${own}`, en: `(prototype: coordinator’s English translation) ${own}` };
      S.questions.push({ id: nid(), company: sh.company, ru: base.ru, zh: base.zh, en: base.en, status: 'pending' });
      S.addedQ += 1;
      S.sheet = null;
      log('delegate', `${me.ru} задала вопрос ${sh.company} → у координатора «ждут перевода».`);
      toast('Вопрос у координатора: он переведёт и отправит компании');
    },
    rate: (n) => { const first = !S.myRating; S.myRating = Number(n); if (first) log('delegate', `Оценка визита ${n}/5 → у JD.com общий отзыв ${rating().avg} (${rating().n} оценок), без имён.`); },
    followup: () => { S.sheet = { type: 'followup', company: 'JD.com', ftype: 'samples', consent: true }; },
    submitFollowup: () => {
      const sh = S.sheet;
      const t = FOLLOW_TYPES.find((x) => x.key === sh.ftype);
      S.followups.push({ id: nid(), company: sh.company, typeRu: t.ru, zh: t.zh, en: t.en, consent: sh.consent, status: 'new' });
      S.sheet = null;
      log('delegate', `${me.ru}: «Хочу продолжить» с ${sh.company} (${t.ru.toLowerCase()}) → у координатора на пульте.`);
      toast('Запрос у координатора');
    },

    // координатор
    startBroadcast: () => { S.guideLive = true; log('coordinator', 'Включил радиогид: говорит Ли Мэй → у делегатов «Гид в эфире», слушают в наушниках.'); toast('Трансляция началась: делегаты видят «Гид в эфире»'); },
    stopBroadcast: () => { S.guideLive = false; S.listening = false; log('coordinator', 'Остановил трансляцию радиогида.'); },
    thankReview: (id) => { const r = S.reviews.find((x) => x.id === id); r.status = 'done'; log('coordinator', `Поблагодарил ${ME_ACC} за отзыв.`); toast('Спасибо отправлено'); },
    shareReview: (id) => { const r = S.reviews.find((x) => x.id === id); r.status = 'done'; log('coordinator', `Отзыв ${ME_GEN} отправлен в очередь публикаций GTT (есть согласие).`); toast('Отзыв ушёл в очередь публикаций'); },
    markBus: (id) => { S.missing = S.missing.filter((x) => x !== id); log('coordinator', `Отметил ${byId[id].ru} в автобусе → ${busCount()}/18.`); },
    depart: () => {
      S.departed = true;
      log('coordinator', `«Автобус выехал» → JD.com видит «代表团已出发», делегаты — «в пути».`);
      if (S.hostSubscribed) { S.hostNotice = true; log('host', 'JD.com получила уведомление WeChat: «代表团已出发，预计10:25到达».'); toast('JD.com получила уведомление в WeChat'); }
      else toast('JD.com увидит статус на странице визита. Уведомление придёт, если включит напоминания');
    },
    acceptHema: () => {
      S.hema = 'accepted';
      S.dNotices.unshift({ text: 'Hema перенесли на 14:00 (ср, 11 ноября). План уже обновлён.', time: now(), tone: 'warn' });
      log('coordinator', 'Принял перенос Hema на 14:00 → у делегатов план обновлён и пришло уведомление.');
      toast('Группа получила уведомление, план обновлён');
    },
    discussHema: () => { S.hema = 'discuss'; log('coordinator', 'Hema: «Обсудить» → открыт чат с менеджером компании.'); toast('В приложении откроется чат с Hema'); },
    acceptJd: () => {
      const p = S.jd.proposal;
      S.jd = { status: 'confirmed', start: p.start, proposal: null };
      S.dNotices.unshift({ text: `JD.com перенесли на ${p.start}. План обновлён.`, time: now(), tone: 'warn' });
      log('coordinator', `Принял время JD.com ${p.start} → у компании «已确认», у делегатов новый план.`);
      toast('JD.com и группа получили новое время');
    },
    rejectJd: () => { S.jd.proposal = null; S.jd.status = 'confirmed'; log('coordinator', `Оставил JD.com прежнее время ${S.jd.start} → компания видит «已确认».`); },
    publishMat: (id) => {
      const m = S.materials.find((x) => x.id === id);
      m.status = 'published';
      S.dNotices.unshift({ text: `Новый материал от JD.com: «${m.name}» — в Материалах`, time: now(), tone: 'info' });
      log('coordinator', `Открыл делегатам «${m.name}» → у делегатов в Материалах, у JD.com статус «已发给代表团».`);
      toast('Материал открыт делегатам');
    },
    translateQ: () => {
      const n = pendingQ();
      S.questions.forEach((q) => { if (q.status === 'pending') q.status = 'sent'; });
      S.translatedQ += n;
      S.basePendingQ = 0;
      log('coordinator', `Перевёл и отправил ${n} ${plural(n, 'вопрос', 'вопроса', 'вопросов')} → компании видят их на китайском.`);
      toast('Вопросы отправлены компаниям на китайском');
    },
    forwardReply: (id) => {
      const r = S.replies.find((x) => x.id === id);
      r.forwarded = true;
      S.dNotices.unshift({ text: `JD.com ответила${r.toName ? ` (для ${r.toName})` : ''}: «${r.text}» — перевод координатора`, time: now(), tone: 'info' });
      log('coordinator', 'Переслал ответ JD.com делегатам → у делегата уведомление на «Сегодня».');
    },
    sendFollowup: (id) => {
      const f = S.followups.find((x) => x.id === id);
      f.status = 'sent';
      if (f.company === 'JD.com') {
        S.requests.push({ id: nid(), d: 'd1', zh: f.zh, en: f.en, consent: f.consent, isNew: true });
        log('coordinator', `Передал запрос ${ME_GEN} в JD.com → у компании во вкладке «访问后»${f.consent ? ' с контактами (есть согласие)' : ' без контактов'}.`);
      } else log('coordinator', `Передал запрос ${ME_GEN} в ${f.company}.`);
      toast('Запрос передан компании');
    },
    remindPdd: () => { S.pddReminded = true; log('coordinator', 'Напомнил Pinduoduo открыть ссылку визита (WeChat и почта).'); toast('Напоминание отправлено'); },
    remindIgor: () => { S.igorReminded = true; log('coordinator', 'Напомнил Игорю Белову загрузить билет.'); toast('Игорь Белов получил напоминание'); },
    openCompany: (id) => { S.sheet = { type: 'company', id }; },
    showQr: () => { S.sheet = { type: 'qr' }; },
    tpl: (k) => { const t = TEMPLATES.find((x) => x.key === k); S.annTpl = k; S.annText = t.ru; },
    sendAnn: () => {
      const text = (S.annText || '').trim();
      if (!text) return toast('Напишите текст объявления');
      if (!S.annTo.d && !S.annTo.h && !S.annTo.tg) return toast('Выберите, кому отправить');
      const t = TEMPLATES.find((x) => x.ru === text);
      S.announcements.unshift({ id: nid(), ru: text, zh: t ? t.zh : `（原型：中文译文）${text}`, en: t ? t.en : `(prototype: English translation) ${text}`, toD: S.annTo.d, toH: S.annTo.h, tg: S.annTo.tg, time: now() });
      if (S.annTo.d) S.dNotices.unshift({ text: `Объявление: ${text}`, time: now(), tone: 'warn' });
      log('coordinator', `Объявление «${text.slice(0, 40)}${text.length > 40 ? '…' : ''}» → ${[S.annTo.d && 'делегатам', S.annTo.h && 'JD.com по-китайски', S.annTo.tg && 'в Telegram'].filter(Boolean).join(', ')}.`);
      toast('Объявление отправлено');
    },

    // компания
    hostPropose: () => { S.form.propNote = ''; S.sheet = { type: 'hostPropose', start: '11:00' }; },
    submitPropose: () => {
      const note = (S.form.propNote || '').trim();
      S.jd.proposal = { start: S.sheet.start, note };
      S.jd.status = 'time_proposed';
      S.sheet = null;
      log('host', `JD.com предложила ${S.jd.proposal.start} вместо ${S.jd.start} → у координатора на пульте «Принять / Оставить».`);
      toast(H[S.lang].sent);
    },
    hostUpload: () => { S.sheet = { type: 'hostUpload' }; },
    submitUpload: (i) => {
      const f = HOST_FILES[Number(i)];
      if (S.materials.some((m) => m.name === f.name)) { S.sheet = null; return toast(S.lang === 'en' ? 'This file is already uploaded' : '该文件已上传'); }
      S.materials.push({ id: nid(), name: f.name, size: f.size, status: 'review' });
      S.sheet = null;
      log('host', `JD.com загрузила «${f.name}» → у координатора «Открыть делегатам».`);
      toast(S.lang === 'en' ? 'Uploaded, under review' : '已上传，等待协调人审核');
    },
    hostReply: () => { S.form.replyText = ''; S.sheet = { type: 'hostReply', to: '' }; },
    submitReply: () => {
      const text = (S.form.replyText || '').trim();
      if (!text) return toast(S.lang === 'en' ? 'Write a reply' : '请输入回复内容');
      const to = S.sheet.to;
      S.replies.push({ id: nid(), text, toName: to ? byId[to].ru : '', forwarded: false });
      S.sheet = null;
      log('host', `JD.com ответила${to ? ` ${byId[to].ru}` : ' группе'} → координатор переведёт и перешлёт.`);
      toast(H[S.lang].sent);
    },
    hostContact: (id) => { S.sheet = { type: 'contact', id }; },
    hostSubscribe: () => { S.hostSubscribed = true; log('host', 'JD.com включила напоминания WeChat → получит уведомление, когда автобус выедет.'); toast(S.lang === 'en' ? 'Reminders on' : '已开启提醒'); },
    hostWechat: () => toast(H[S.lang].wxCopied),
    hostCall: () => toast(H[S.lang].call),
    hostDownload: () => { log('host', 'JD.com скачала список гостей для охраны (имена латиницей, без паспортов).'); toast(H[S.lang].downloaded); },
    copyText: (text) => {
      const done = () => toast(H[S.lang].copied);
      try { navigator.clipboard.writeText(text).then(done, done); } catch (e) { done(); }
    },
  };

  document.addEventListener('click', (e) => {
    const roleBtn = e.target.closest('[data-role]');
    if (roleBtn) { S.role = roleBtn.dataset.role; S.viewAs = null; S.sheet = null; render(); return; }
    const el = e.target.closest('[data-act]');
    if (!el || !screenEl.contains(el)) return;
    const act = el.dataset.act;
    if (el.classList.contains('shade') && act === 'closeSheet') { S.sheet = null; render(); return; }
    if (S.viewAs && !NAV.has(act)) { toast('Режим просмотра: действие делает сам ' + (S.viewAs === 'delegate' ? 'делегат' : S.viewAs === 'agent' ? 'агент' : 'JD.com')); render(); return; }
    const fn = A[act];
    if (!fn) return;
    fn(el.dataset.arg || '');
    render();
  });
  document.addEventListener('input', (e) => {
    const f = e.target.dataset.field;
    if (!f) return;
    if (f === 'cTour') { S.calc.tour = e.target.value; const d = depsOf(e.target.value).find((x) => depFree(x) > 0); S.calc.dep = d ? d.id : ''; render(); return; }
    if (f.startsWith('cit_')) { const [, k, i] = f.split('_'); S.calc.cit[Number(i)][k === 'c' ? 'c' : 'n'] = e.target.value; save(); return; }
    if (f === 'agTour') { S.sheet.tour = e.target.value; const d = depsOf(e.target.value).find((x) => depFree(x) > 0); S.sheet.dep = d ? d.id : 'other'; render(); return; }
    if (f === 'annText') { S.annText = e.target.value; S.annTpl = null; } else S.form[f] = e.target.value;
    save();
  });
  document.addEventListener('change', (e) => {
    const c = e.target.dataset.check;
    if (!c) return;
    if (c === 'consent') { S.sheet.consent = e.target.checked; return; }
    if (c === 'pickCos' || c === 'flight') { S.calc[c] = e.target.checked; save(); return; }
    if (c === 'reviewConsent') { S.reviewConsent = e.target.checked; save(); return; }
    if (c === 'voiceOut') { S.voiceOut = e.target.checked; render(); return; }
    if (c === 'subtitles') { S.subtitles = e.target.checked; render(); return; }
    S.annTo[c] = e.target.checked;
    save();
  });
  document.getElementById('reset').addEventListener('click', () => { S = fresh(); render(); });

  render();
})();
</script>
